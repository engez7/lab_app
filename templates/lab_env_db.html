<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Lab Conditions by RPi</title>
    <meta name="description" content="Lab conditions - RPi">
    <meta name="author" content="Ezio">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="//fonts.googleapis.com/css?family=Raleway:400,300,600" rel="stylesheet" type="text/css">
    <link rel="stylesheet" href="/static/css/normalize.css">
    <link rel="stylesheet" href="/static/css/skeleton.css">
    <link rel="icon" type="image/png" href="/static/images/favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        canvas {
            max-width: 100%;
            height: auto !important;
        }

        .chart-container {
            position: relative;
            margin: auto;
            width: 90%; /* Adjust as needed */
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/">Home</a><br>
        <a href="/lab_temp">Current Temp & Hum</a><br><br><br>

        <div class="chart-container">
            <canvas id="chart_temps"></canvas>
        </div>
        <div class="chart-container">
            <canvas id="chart_humid"></canvas>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            // Temperature Chart
            var ctxTemp = document.getElementById('chart_temps').getContext('2d');
            var tempChart = new Chart(ctxTemp, {
                type: 'line',
                data: {
                    labels: [
                        {% for row in temp %}
                            "{{row[0]}}",
                        {% endfor %}
                    ],
                    datasets: [{
                        label: 'Temperature (°C)',
                        data: [
                            {% for row in temp %}
                                {{ '%0.2f' | format(row[1]) }},
                            {% endfor %}
                        ],
                        borderColor: 'rgba(255, 99, 132, 1)',
                        backgroundColor: 'rgba(255, 99, 132, 0.2)',
                        borderWidth: 2,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        tooltip: { enabled: true },
                        legend: { display: true, position: 'top' }
                    },
                    scales: {
                        x: {
                            title: { display: true, text: 'Date' }
                        },
                        y: {
                            title: { display: true, text: 'Degrees (°C)' }
                        }
                    }
                }
            });

            // Humidity Chart
            var ctxHumid = document.getElementById('chart_humid').getContext('2d');
            var humidChart = new Chart(ctxHumid, {
                type: 'line',
                data: {
                    labels: [
                        {% for row in hum %}
                            "{{row[0]}}",
                        {% endfor %}
                    ],
                    datasets: [{
                        label: 'Humidity (%)',
                        data: [
                            {% for row in hum %}
                                {{ '%0.2f' | format(row[1]) }},
                            {% endfor %}
                        ],
                        borderColor: 'rgba(54, 162, 235, 1)',
                        backgroundColor: 'rgba(54, 162, 235, 0.2)',
                        borderWidth: 2,
                        tension: 0.4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        tooltip: { enabled: true },
                        legend: { display: true, position: 'top' }
                    },
                    scales: {
                        x: {
                            title: { display: true, text: 'Date' }
                        },
                        y: {
                            title: { display: true, text: 'Percent (%)' }
                        }
                    }
                }
            });

            // Redraw charts on window resize
            window.addEventListener('resize', function () {
                tempChart.resize();
                humidChart.resize();
            });
        });
    </script>
</body>
</html>
