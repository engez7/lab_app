<!DOCTYPE html>
<html lang="en">
  <head>
    <!-- Basic Page Needs -->
    <meta charset="utf-8">
    <title>Lab Conditions by RPi</title>
    <meta name="description" content="Lab conditions - RPi">
    <meta name="author" content="Ezio">
    <!-- Mobile Specific Metas -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- FONT -->
    <link href="//fonts.googleapis.com/css?family=Raleway:400,300,600" rel="stylesheet" type="text/css">
    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/normalize.css">
    <link rel="stylesheet" href="/static/css/skeleton.css">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/static/images/favicon.png">
    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    </br>
    <div class="container">
      <a href="/">Home</a></br>
      <a href="/lab_temp">Current Temp & Hum</a></br></br></br>

      <div class="row">
        <h4>Last values...</h4>
      </div>
      <div class="row">
        <form id="range_select" action = "/lab_env_db" method="GET">
        <table class="u-full-width">
          <tbody>
            <tr>  
              <td>
                <input type="radio" name="range_h" value="3" id="radio_3" /><label for="radio_3">3hrs</label>
              </td>
              <td>
                <input type="radio" name="range_h" value="6" id="radio_6" /><label for="radio_6">6hrs</label>
              </td>
              <td>
                <input type="radio" name="range_h" value="12" id="radio_12" /><label for="radio_12">12hrs</label>
              </td>
              <td>
                <input type="radio" name="range_h" value="24" id="radio_24" /><label for="radio_24">24hrs</label>
              </td>
          </tbody>
        </table>
        </form>
      </div>
      </br>

      <div class="row">
        <h4>...or choose a time range</h4>
      </div>
        <form id="datetime_range" action="/lab_env_db" method="GET">
          <div class="row">
            <label for="from">From date</label>
            <input class="u-full-width" id="datetimepicker1" type="text" value="{{from_date}}" name="from">
          </div>
          <div class="row">
            <label for="to">To date</label>
            <input class="u-full-width" id="datetimepicker2" type="text" value="{{to_date}}" name="to">
          </div>
          <div class="row">
            <input class="button-primary" type="submit" value="Submit" id="submit_button" />
          </div>
        </form></br></br>

        <div class="two-thirds column" style="margin-top: 5%">
        <div class="row">
          <div class="row">
            <div class="three columns">
	        <canvas id="chart_temps" width="600" height="400"></canvas>
		<canvas id="chart_humid" width="600" height="400"></canvas>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>

  <!-- Fetch jQuery -->
  <script src="//code.jquery.com/jquery-3.5.0.min.js"></script>

  <!-- Datetimepicker files start -->
  <link rel="stylesheet" type="text/css" href="//cdnjs.cloudflare.com/ajax/libs/jquery-datetimepicker/2.5.20/jquery.datetimepicker.min.css"/ >
  <script src="//cdnjs.cloudflare.com/ajax/libs/jquery-datetimepicker/2.5.20/jquery.datetimepicker.full.min.js"></script>
  <script>
    jQuery('#datetimepicker1').datetimepicker(
      {
        format:'Y-m-d H:i',
        defaultDate:'{{from_date}}'
      });
    jQuery('#datetimepicker2').datetimepicker(
      {
        format:'Y-m-d H:i',
        defaultDate:'{{to_date}}'
      });

    jQuery("#range_select input[type=radio]").click(function(){ 
        jQuery("#range_select").submit();
      });
  </script>

  <!-- Charts.js -->
  <script>
document.addEventListener("DOMContentLoaded", function () {
    var ctxTemp = document.getElementById('chart_temps').getContext('2d');
    var tempChart = new Chart(ctxTemp, {
        type: 'line',
        data: {
            labels: [
                {% for row in temp %}
                    "{{row[0]}}",
                {% endfor %}
            ],
            datasets: [{
                label: 'Temperature (°C)',
                data: [
                    {% for row in temp %}
                        {{ '%0.2f' | format(row[1]) }},
                    {% endfor %}
                ],
                borderColor: 'rgba(255, 99, 132, 1)',
                backgroundColor: 'rgba(255, 99, 132, 0.2)',
                borderWidth: 2,
                tension: 0.4 // Curva morbida
            }]
        },
        options: {
            responsive: true,
            plugins: {
                tooltip: {
                    enabled: true
                }
            },
            scales: {
                x: {
                    title: {
                        display: true,
                        text: 'Date'
                    }
                },
                y: {
                    title: {
                        display: true,
                        text: 'Degrees (°C)'
                    }
                }
            }
        }
    });
});
</script>
<script>
document.addEventListener("DOMContentLoaded", function () {
    var ctxHumid = document.getElementById('chart_humid').getContext('2d');
    var humidChart = new Chart(ctxHumid, {
        type: 'line',
        data: {
            labels: [
                {% for row in hum %}
                    "{{row[0]}}",
                {% endfor %}
            ],
            datasets: [{
                label: 'Humidity (%)',
                data: [
                    {% for row in hum %}
                        {{ '%0.2f' | format(row[1]) }},
                    {% endfor %}
                ],
                borderColor: 'rgba(54, 162, 235, 1)',
                backgroundColor: 'rgba(54, 162, 235, 0.2)',
                borderWidth: 2,
                tension: 0.4 // Curva morbida
            }]
        },
        options: {
            responsive: true,
            plugins: {
                tooltip: {
                    enabled: true
                }
            },
            scales: {
                x: {
                    title: {
                        display: true,
                        text: 'Date'
                    }
                },
                y: {
                    title: {
                        display: true,
                        text: 'Percent (%)'
                    }
                }
            }
        }
    });
});
</script>

</html>
